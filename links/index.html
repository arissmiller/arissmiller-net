<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interesting things to read, hear, watch, play, visit, and examine."
    />
    <meta name="theme-color" content="#080a0f" />
    <title>Interesting Things — Armen Rissmiller</title>
    <link rel="stylesheet" href="./links.css" />
    <noscript>
      <style>
        .category-nav {
          display: none !important;
        }

        .catalog-scroll {
          overflow-y: auto !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <canvas class="circuit-field" data-circuit-field aria-hidden="true"></canvas>
    <div class="page-shade" aria-hidden="true"></div>

    <div class="terminal-frame">
      <main class="terminal-window">
        <header class="window-header">
          <a class="home-control" href="/" aria-label="Return home">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M16.5 10H3.5M8.5 5 3.5 10l5 5" />
            </svg>
          </a>

          <div class="window-identity">
            <h1>Interesting Things</h1>
            <p>A small catalog of things I recommend. Not a 'greatest of all time' list.</p>
          </div>
        </header>

        <div class="window-body">
          <nav class="category-nav" aria-label="Catalog categories">
            <div
              class="category-tabs"
              role="tablist"
              aria-label="Catalog categories"
              data-category-tabs
            >
              <!-- LINKS_TABS -->
            </div>
          </nav>

          <section
            class="catalog-pane"
            id="catalog-panel"
            role="tabpanel"
            tabindex="0"
            aria-labelledby="category-tab-all"
            data-catalog-panel
          >
            <header class="catalog-status">
              <p><span aria-hidden="true">&gt;</span> INDEX / <strong data-active-label>ALL</strong></p>
              <p class="result-count" data-result-count><!-- LINKS_COUNT --></p>
            </header>

            <div class="catalog-scroll" data-catalog-scroll>
              <ol class="catalog-list" data-catalog-list>
                <!-- LINKS_ITEMS -->
              </ol>

              <div class="empty-state" data-empty-state hidden>
                <h2>Nothing is filed here yet.</h2>
                <p>Choose another category.</p>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script type="module" src="./links.js"></script>
  </body>
</html>
