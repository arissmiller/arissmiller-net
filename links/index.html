<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interesting things to read, hear, watch, play, visit, and examine."
    />
    <meta name="theme-color" content="#080a0f" />
    <title>Interesting Things — Armen Rissmiller</title>
    <link rel="stylesheet" href="./links.css" />
    <noscript>
      <style>
        .category-pane {
          display: none !important;
        }

        .window-body {
          grid-template-rows: minmax(0, 1fr) !important;
        }

        .link-content {
          display: block !important;
        }

        .link-index {
          height: 100%;
          overflow: auto;
        }

        .link-detail {
          display: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <canvas class="circuit-field" data-circuit-field aria-hidden="true"></canvas>
    <div class="page-shade" aria-hidden="true"></div>

    <div class="terminal-frame">
      <main class="terminal-window">
        <header class="window-header">
          <a class="home-control" href="/" aria-label="Return home">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M16.5 10H3.5M8.5 5 3.5 10l5 5" />
            </svg>
          </a>

          <div class="window-identity">
            <h1>Interesting Things</h1>
          </div>
        </header>

        <div class="window-body">
          <section class="category-pane" aria-labelledby="category-heading">
            <div class="pane-heading">
              <h2 id="category-heading">Categories</h2>
            </div>

            <div
              class="category-tabs"
              role="tablist"
              aria-label="Link categories"
              data-category-tabs
            >
              <!-- LINKS_TABS -->
            </div>
          </section>

          <section
            class="link-pane"
            id="link-panel"
            role="tabpanel"
            tabindex="0"
            aria-labelledby="category-tab-all"
            data-link-panel
          >
            <div class="link-toolbar">
              <h2 data-active-label>Everything</h2>
              <p class="result-count" data-result-count>00 entries</p>
            </div>

            <div class="link-content">
              <div class="link-index">
                <ol class="link-list" data-link-list>
                  <!-- LINKS_ITEMS -->
                </ol>

                <div class="empty-state" data-empty-state hidden>
                  <h3>Nothing is filed here yet.</h3>
                  <p>Choose another category or add an entry to the catalog.</p>
                </div>
              </div>

              <!-- LINKS_DETAIL -->
            </div>
          </section>
        </div>
      </main>
    </div>

    <script type="module" src="./links.js"></script>
  </body>
</html>
