<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Stock graph clipart</title>
  <desc id="desc">A clean financial chart illustration with rising trend lines and candlesticks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf4ff" />
      <stop offset="100%" stop-color="#e9fdf2" />
    </linearGradient>
    <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />
  <rect x="66" y="66" width="1468" height="768" rx="36" fill="#ffffff" stroke="#d6e3f0" stroke-width="3" filter="url(#softShadow)" />

  <g stroke="#dbe9f5" stroke-width="2">
    <line x1="160" y1="190" x2="1460" y2="190" />
    <line x1="160" y1="300" x2="1460" y2="300" />
    <line x1="160" y1="410" x2="1460" y2="410" />
    <line x1="160" y1="520" x2="1460" y2="520" />
    <line x1="160" y1="630" x2="1460" y2="630" />
    <line x1="160" y1="740" x2="1460" y2="740" />

    <line x1="260" y1="160" x2="260" y2="760" />
    <line x1="420" y1="160" x2="420" y2="760" />
    <line x1="580" y1="160" x2="580" y2="760" />
    <line x1="740" y1="160" x2="740" y2="760" />
    <line x1="900" y1="160" x2="900" y2="760" />
    <line x1="1060" y1="160" x2="1060" y2="760" />
    <line x1="1220" y1="160" x2="1220" y2="760" />
    <line x1="1380" y1="160" x2="1380" y2="760" />
  </g>

  <g stroke="#64748b" stroke-linecap="round">
    <line x1="160" y1="760" x2="1460" y2="760" stroke-width="7" />
    <line x1="160" y1="760" x2="160" y2="160" stroke-width="7" />
  </g>

  <g fill="#10b981" opacity="0.82">
    <rect x="220" y="585" width="46" height="175" rx="6" />
    <rect x="400" y="532" width="46" height="228" rx="6" />
    <rect x="580" y="495" width="46" height="265" rx="6" />
    <rect x="760" y="438" width="46" height="322" rx="6" />
    <rect x="940" y="400" width="46" height="360" rx="6" />
    <rect x="1120" y="350" width="46" height="410" rx="6" />
    <rect x="1300" y="300" width="46" height="460" rx="6" />
  </g>

  <g stroke="#0f766e" stroke-width="6" stroke-linecap="round">
    <line x1="243" y1="560" x2="243" y2="620" />
    <line x1="423" y1="505" x2="423" y2="575" />
    <line x1="603" y1="460" x2="603" y2="535" />
    <line x1="783" y1="405" x2="783" y2="470" />
    <line x1="963" y1="365" x2="963" y2="430" />
    <line x1="1143" y1="318" x2="1143" y2="378" />
    <line x1="1323" y1="268" x2="1323" y2="328" />
  </g>

  <polyline
    points="220,620 360,560 500,580 640,500 780,430 920,455 1060,365 1200,315 1340,235"
    fill="none"
    stroke="url(#lineGradient)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#softShadow)"
  />

  <g fill="#0ea5e9" stroke="#ffffff" stroke-width="5">
    <circle cx="220" cy="620" r="14" />
    <circle cx="360" cy="560" r="14" />
    <circle cx="500" cy="580" r="14" />
    <circle cx="640" cy="500" r="14" />
    <circle cx="780" cy="430" r="14" />
    <circle cx="920" cy="455" r="14" />
    <circle cx="1060" cy="365" r="14" />
    <circle cx="1200" cy="315" r="14" />
    <circle cx="1340" cy="235" r="14" />
  </g>

  <path
    d="M1298 234 L1366 214 L1347 281"
    fill="none"
    stroke="#0891b2"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
