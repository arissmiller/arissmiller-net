name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: railway-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Missing GitHub secret: RAILWAY_TOKEN" >&2
            exit 1
          fi
          if [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "Missing GitHub variable: RAILWAY_PROJECT_ID" >&2
            exit 1
          fi
          if [ -z "$RAILWAY_ENVIRONMENT_ID" ]; then
            echo "Missing GitHub variable: RAILWAY_ENVIRONMENT_ID" >&2
            exit 1
          fi

          ARGS=(
            --ci
            --project "$RAILWAY_PROJECT_ID"
            --environment "$RAILWAY_ENVIRONMENT_ID"
          )

          if [ -n "$RAILWAY_SERVICE_ID" ]; then
            ARGS+=(--service "$RAILWAY_SERVICE_ID")
          fi

          railway up "${ARGS[@]}"
